name: Deploy

# Fires after `CI` (lint, typecheck, unit tests, Wrangler build, e2e) finishes
# on `main` — i.e. only once a merge has landed and gone green, never on a
# raw push race or a still-running PR check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: bun run build:cf

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Surface deployment URL on the commit
        if: steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/comments" \
            -f body="Deployed to Cloudflare Workers: ${DEPLOYMENT_URL}"
