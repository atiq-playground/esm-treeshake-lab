name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages + web
        run: bun run build
        env:
          AUTH_PUBLIC_API_URL: http://127.0.0.1:8787/public/api
          AUTH_ADMIN_API_URL: http://127.0.0.1:8787/admin/api
          ACCOUNT_PUBLIC_API_URL: http://127.0.0.1:8787/public/api
          ACCOUNT_ADMIN_API_URL: http://127.0.0.1:8787/admin/api
          OIDC_CLIENT_SECRET: replace-me
          COOKIE_SECURE: "0"

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bunx nx run @apps/web:test

      # Marker search in scripts/check-treeshake-markers.sh needs rg.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Tree-shake markers
        run: bun run check:treeshake
